version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nailagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: nailagent
      MYSQL_USER: nailagent
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: