<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 480px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .card { background: white; border-radius: 16px; padding: 40px 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #191919; margin-bottom: 8px; }
        p { font-size: 14px; color: #777; margin-bottom: 28px; }
        .error-box { background: #fff3f3; border-radius: 8px; padding: 16px; margin-bottom: 24px; text-align: left; }
        .error-code { font-size: 12px; color: #e03131; font-weight: 600; margin-bottom: 4px; }
        .error-msg { font-size: 14px; color: #555; }
        .retry-btn {
            display: block; padding: 14px; background: #3182f6; color: white;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="icon">❌</div>
        <h2>결제에 실패했습니다</h2>
        <p>결제 처리 중 문제가 발생했습니다.</p>

        <div class="error-box">
            <div class="error-code" th:text="'에러 코드: ' + ${errorCode}"></div>
            <div class="error-msg" th:text="${errorMessage}"></div>
        </div>

        <button class="retry-btn" onclick="history.back()">다시 시도</button>
    </div>
</div>
</body>
</html>
