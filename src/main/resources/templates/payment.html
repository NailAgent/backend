<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약금 결제</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 480px; margin: 40px auto; padding: 0 16px; }
        .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #191919; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #555; }
        .info-row:last-of-type { border-bottom: none; margin-bottom: 28px; }
        .info-row span:last-child { font-weight: 600; color: #191919; }
        .amount { font-size: 22px !important; color: #3182f6 !important; }
        .pay-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s;
            margin-bottom: 12px;
        }
        .btn-card  { background: #3182f6; color: white; }
        .btn-card:hover  { background: #1b64da; }
        .btn-toss  { background: #0064ff; color: white; }
        .btn-toss:hover  { background: #0050cc; }
        #error-message {
            display: none; color: #e03131; font-size: 13px;
            margin-bottom: 12px; padding: 10px;
            background: #fff3f3; border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>예약금 결제</h2>
        <div class="info-row">
            <span>주문명</span>
            <span th:text="${orderName}"></span>
        </div>
        <div class="info-row">
            <span>고객명</span>
            <span th:text="${customerName}"></span>
        </div>
        <div class="info-row">
            <span>결제 금액</span>
            <span class="amount" th:text="${#numbers.formatInteger(amount, 0, 'COMMA') + '원'}"></span>
        </div>

        <div id="error-message"></div>

        <button class="pay-btn btn-card" onclick="pay('카드')">카드 결제</button>
        <button class="pay-btn btn-toss" onclick="pay('토스페이')">토스페이</button>
    </div>
</div>

<script src="https://js.tosspayments.com/v1"></script>
<script th:inline="javascript">
    var clientKey    = /*[[${clientKey}]]*/ '';
    var amount       = /*[[${amount}]]*/ 0;
    var orderId      = /*[[${orderId}]]*/ '';
    var orderName    = /*[[${orderName}]]*/ '';
    var customerName = /*[[${customerName}]]*/ '';

    var tossPayments = TossPayments(clientKey);

    function pay(method) {
        var errBox = document.getElementById('error-message');
        errBox.style.display = 'none';

        tossPayments.requestPayment(method, {
            amount: amount,
            orderId: orderId,
            orderName: orderName,
            customerName: customerName,
            successUrl: window.location.origin + '/payment/success',
            failUrl: window.location.origin + '/payment/fail'
        }).catch(function(e) {
            console.error('결제 오류:', e);
            errBox.textContent = e.message || '결제 중 오류가 발생했습니다.';
            errBox.style.display = 'block';
        });
    }
</script>
</body>
</html>
