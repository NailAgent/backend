<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
        .container { max-width: 480px; margin: 80px auto; padding: 0 16px; text-align: center; }
        .card { background: white; border-radius: 16px; padding: 40px 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 700; color: #191919; margin-bottom: 8px; }
        p { font-size: 14px; color: #777; margin-bottom: 28px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #555; text-align: left; }
        .info-row:last-of-type { border-bottom: none; }
        .info-row span:last-child { font-weight: 600; color: #191919; word-break: break-all; }
        .close-btn {
            display: block; margin-top: 28px; padding: 14px; background: #3182f6; color: white;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="icon">✅</div>
        <h2>결제가 완료되었습니다</h2>
        <p>예약금 결제가 정상적으로 처리되었습니다.</p>

        <div class="info-row">
            <span>주문 번호</span>
            <span th:text="${orderId}"></span>
        </div>
        <div class="info-row">
            <span>결제 금액</span>
            <span th:text="${#numbers.formatInteger(amount, 0, 'COMMA') + '원'}"></span>
        </div>
        <div class="info-row">
            <span>결제 키</span>
            <span th:text="${paymentKey}"></span>
        </div>

        <button class="close-btn" onclick="window.close()">창 닫기</button>
    </div>
</div>
</body>
</html>
